services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: legal_agent
      POSTGRES_PASSWORD: legal_agent
      POSTGRES_DB: legal_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_agent -d legal_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
